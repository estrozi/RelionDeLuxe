<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pipeline Atlas</title><link rel="stylesheet" href="tree-atlas.css"></head><body><main><section class="canvas" aria-label="Interactive dependency graph"><svg id="graph" tabindex="0" aria-label="Job graph. Use arrow keys to navigate, Home and End for graph boundaries, PageUp and PageDown for visible boundaries, and plus or minus to zoom."><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a6475"/></marker><marker id="hotArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#62d9bd"/></marker></defs><g id="world"></g></svg><div class="overlay stats" id="stats"></div><div class="overlay toolbar"><label class="layout-toggle"><input id="pureVertical" type="checkbox"> pure vertical</label><button id="minus" aria-label="Zoom out">−</button><span id="zoom"></span><button id="plus" aria-label="Zoom in">+</button><button id="center">Center</button><button id="fitOne">Fit one</button><button id="fit">Fit all</button></div></section></main><script src="tree-atlas.js"></script></body></html>
