<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RelionDeLuxe · Tilt images</title><link rel="stylesheet" href="/excluder.css"></head><body>
<header><strong>Tilt images</strong><span id="mode">Loading…</span><label>Tilt series <select id="series"></select></label><span id="counts"></span><button id="save" hidden>Save selection</button><button id="finish" hidden>Save and finish job</button></header>
<div class="controls"><button id="previous" title="Previous tilt image">←</button><button id="next" title="Next tilt image">→</button><label>Scale <select id="scale"><option value="native">1:1 (no scaling)</option><option value="width">Fit width</option><option value="height" selected>Fit height</option></select></label><label>Contrast <input id="contrast" type="range" min="0.5" max="5" step="0.1" value="1"></label><label><input id="invert" type="checkbox">Invert</label><span id="selection-tools" hidden><button id="all">Keep series</button><button id="none">Exclude series</button></span><span>↑/↓: inspect images · checked = retained</span></div>
<p id="status" role="status">Loading tilt-series metadata…</p><main><aside id="images" aria-label="Tilt images"></aside><section id="viewport"><canvas id="density"></canvas></section></main><footer id="info"></footer><script type="module" src="/excluder.js"></script></body></html>
