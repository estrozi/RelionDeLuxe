<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manual picking · RelionDeLuxe</title><link rel="stylesheet" href="/picker.css"><script type="module" src="/picker.js"></script></head><body><div class="picker-toolbar"><header><strong>RelionDeLuxe · Manual picking</strong><span id="job"></span><button id="save" disabled>Save picks</button><button id="finish" disabled>Save and finish job</button></header><div class="controls"><label>Diameter (Å)<input id="diameter" type="number" min="1" step="1"></label><label>Scale<input id="zoom" type="number" min="0.02" max="4" step="0.05"></label><label>Contrast (σ)<input id="contrast" type="number" min="0" step="0.25"></label><label>Black<input id="black" type="number" step="any"></label><label>White<input id="white" type="number" step="any"></label><label id="min-fom-control" hidden title="Display only: hide circles below this FOM. Blank shows all. Saving and power cleanup still include all particles.">Min FOM<input id="min-fom" type="number" step="0.01" placeholder="All" aria-label="Minimum displayed picking figure of merit"></label><button id="undo" disabled>Undo</button><span id="count"></span></div></div><p id="status" role="status">Loading…</p><main><aside><div class="ctf-panel"><h3>CTF diagnostic</h3><canvas id="ctf" hidden></canvas><p id="ctf-status"></p></div><p id="picking-help">Click to add · right-click a circle to remove. Picks save automatically before switching micrographs.</p><div id="mics" tabindex="0" aria-label="Micrographs"></div></aside><section id="view"><canvas id="image" aria-label="Micrograph particle picker"></canvas></section></main></body></html>
